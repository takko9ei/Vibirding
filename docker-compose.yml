services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vibirding
      POSTGRES_USER: vibirding
      POSTGRES_PASSWORD: vibirding
    ports:
      - "5432:5432"
    volumes:
      - vibirding_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibirding -d vibirding"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  vibirding_postgres_data:
